<!DOCTYPE html>
<html>
<head>
    <title>Membuat Desain Form Login Dengan CSS</title>
    <!-- Menghubungkan file CSS -->
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <h1>
        Membuat Desain Form Login Dengan CSS<br>
    </h1>
    <div class="kotak_login">
        <p class="tulisan_login">
            Silahkan login
        </p>
        <form>
            <label>Username</label>
            <input
                type="text"
                name="username"
                class="form_login"
                placeholder="Username">
            <label>Password</label>
            <input
                type="password"
                name="password"
                class="form_login"
                placeholder="Password">
            <input
                type="submit"
                class="tombol_login"
                value="LOGIN">
        </form>
    </div>
</body>
</html>
