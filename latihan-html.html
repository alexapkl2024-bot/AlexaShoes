<!DOCTYPE html>
<html lang="id">
<head>
    <title>Latihan form</title>
</head>
<body>
    <h1> Form Identitas Diri</h1>
    <img src="BUKTI SUBMIT.png" alt="Foto Profil Saya" width="300">
    <form action="#">
    Nama <input type="text" name="nama" value="Nama Kamu" />
    <br />
    Password: <input type="password" name="password" />
    <br />
    Jenis Kelamin:
    <input type="radio" name="jenis-kelamin" value="laki-laki" checked /> laki-laki
    <input type="radio" name="jenis-kelamin" value="perempuan" checked /> perempuan
    <br />
    Hobi
    <input type="Checkbox" name="hobi_baca" /> Membaca buku
    <input type="Checkbox" name="hobi_nulis" /> Menulis
    <input type="Checkbox" name="hobi_mancing" /> memancing
    <input type="Checkbox" name="hobi_lainnya" /> lainnya
    <br />
    Asal Kota:
    <select name="asal_kota">
        <option value="kota Salatiga"> Salatiga</option>
        <option value="kota jakarta"> jakarta</option>
        <option value="kota Semarang"> Semarang</option>
    </select>
    <br/>
   Komentar:
    <textarea name="komentar" rows="5" cols="20">
    Ini adalah isi dari text area..............silahkan isi komentar Anda 
    </textarea>
    <br />
    <input type="submit" value="Submit" >
</form>

</body>
</html>
